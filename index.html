<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог рецептів — Пошук смачних страв</title>
    <meta name="description" content="Зручний каталог рецептів з пошуком, фільтрацією та детальною інформацією." />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-container">
        <h1>🍳 Каталог Рецептів</h1>
        <p class="subtitle">Знайдіть ідеальний рецепт для вашого обіду чи вечері</p>
      </div>
    </header>

    <main id="main-content" class="container">
      <!-- Панель керування: пошук та фільтри -->
      <section class="controls-section" aria-label="Панель пошуку та фільтрації">
        <div class="search-box">
          <label for="search-input" class="visually-hidden">Пошук рецептів</label>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Пошук за назвою або інгредієнтом..." 
            autocomplete="off"
          />
        </div>
        <div class="filter-box">
          <label for="category-select" class="visually-hidden">Фільтр за категорією</label>
          <select id="category-select">
            <option value="">Усі категорії</option>
          </select>
        </div>
      </section>

      <!-- Етапи: Loading, Error, Content -->
      <div id="status-container" aria-live="polite"></div>

      <!-- Список рецептів -->
      <section aria-label="Список рецептів">
        <div id="recipes-grid" class="recipes-grid"></div>
      </section>
    </main>

    <!-- Модальне вікно для деталей рецепта -->
    <div id="recipe-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content">
        <button id="close-modal-btn" class="close-btn" aria-label="Закрити вікно">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Каталог Рецептів. Розроблено для навчального проєкту.</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
